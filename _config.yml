# Site settings
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change it, restart the server process.

title: Mehrnoosh Oghbaie
title_separator: "|"
subtitle: "Machine Learning · Drug Discovery · Bioinformatics"
description: >-
  Personal website of Mehrnoosh Oghbaie — Machine Learning Engineer and
  scientist working at the intersection of AI, genomics, proteomics and drug discovery.
url: "https://moghbaie.github.io"
baseurl: ""
repository: "moghbaie/moghbaie.github.io"
locale: "en-US"
github_username: moghbaie
minimal_mistakes_skin: air
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
timezone: America/New_York

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Mehrnoosh Oghbaie"
  avatar : "/assets/images/Mehrnoosh_Oghbaie.JPEG"
  bio    : "Hybrid scientist/engineer applying machine learning to real-world problems in genomics, proteomics and drug discovery."
  location: "New York, NY"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/moghbaie"
    - label: "Hugging Face"
      icon: "fas fa-fw fa-robot"
      url: "https://huggingface.co/moghbaie"
    # Uncomment and fill in to show more links in the sidebar:
    # - label: "LinkedIn"
    #   icon: "fab fa-fw fa-linkedin"
    #   url: "https://www.linkedin.com/in/YOUR-HANDLE/"
    # - label: "Google Scholar"
    #   icon: "fas fa-fw fa-graduation-cap"
    #   url: "https://scholar.google.com/citations?user=YOUR-ID"
    # - label: "Email"
    #   icon: "fas fa-fw fa-envelope-square"
    #   url: "mailto:you@example.com"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/moghbaie"
    - label: "Hugging Face"
      icon: "fas fa-fw fa-robot"
      url: "https://huggingface.co/moghbaie"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
