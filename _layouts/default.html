<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">Mehrnoosh Oghbaie</a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/#work' | relative_url }}">What I do</a>
      <a href="{{ '/#experience' | relative_url }}">Experience</a>
      {% comment %} Hidden for now — remove these comment tags to show them again:
      <a href="{{ '/work/' | relative_url }}">Sample work</a>
      <a href="{{ '/writing/' | relative_url }}">Writing</a>
      {% endcomment %}
      <a class="cta" href="{{ '/#contact' | relative_url }}">Say hello</a>
    </nav>
  </div>
</header>

<main class="wrap">
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© {{ site.time | date: "%Y" }} Mehrnoosh Oghbaie</span>
    <span class="mono">Long Island City, NY</span>
  </div>
</footer>

</body>
</html>
