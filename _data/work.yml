# Entries shown on the Sample work page (/work/).
# Each entry: title, org (optional), summary, tags (list), links (optional list of label + url).

projects:
  - title: Reconstructing patient journeys from partial data
    org: Kontakt.io · 2025 — now
    summary: >-
      Inferring how patients move through three hospitals and 12 clinics when nobody tracks them directly —
      graph-based inference and probabilistic models on live Kafka event streams, plus process mining to
      locate bottlenecks. Surfaced opportunities projected to lift prime-time room utilization by 20% and
      cut wait times by 15 minutes.
    tags: [Graphs, Probabilistic models, Process mining, Kafka]

  - title: LLM search over biomedical knowledge graphs
    org: AbbVie · 2025
    summary: >-
      Natural-language scientific search on top of biomedical knowledge graphs that sped up drug-target
      identification by 30%, a GraphRAG workflow spanning 50+ disease areas, MCP tools linking three
      research platforms, and an evaluation framework for AI-assisted research.
    tags: [LLMs, GraphRAG, MCP, Evaluation]

  - title: Enterprise knowledge platform & adverse-event detection
    org: Johnson & Johnson · 2021 — 2025
    summary: >-
      A Neo4j + Databricks LLM knowledge platform used by 10+ teams, and an adverse-event detection system
      that was 30% more accurate with 25% fewer false positives than the previous approach.
    tags: [Neo4j, Databricks, LLMs, Pharmacovigilance]

  - title: Predicting protein interactions with random walks
    org: Rockefeller University · 2018 — 2023
    summary: >-
      Random-walk-with-restart models over protein interaction networks that reached 85% prediction accuracy
      and cut candidate screening time by 60%, built on proteomics pipelines serving 10+ labs.
    tags: [Network biology, Proteomics, R, Python]

